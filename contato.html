<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Rematch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <span class="logo"> ⚽ Rematch</span>
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html" class="ativo">Contato</a>
        </nav>
    </header>

    <main>
        <section class="conteudo">
            <h1>Contato</h1>
            <p>Caso queira encher o saco dos desenvolvedores para eles acordarem e so preencher kk</p>

            <form class="form" action="#">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="name" placeholder="Seu nome">
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="voce@email.com">
                </div>
                <div class="campo">
                    <label for="msg">Mensagem</label>
                    <textarea name="msg" id="msg" rows="4" placeholder="Escreva sua msg"></textarea>
                </div>
                <button type="submit" class="botao">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>Feito por Cesar Emanuel - projeto frontend</p>
    </footer>
</body>
</html>
